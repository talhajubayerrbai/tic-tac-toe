name: Deploy tic-tac-toe

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Git revision to deploy"
        required: false
        default: ""
      udap_run_id:
        description: "UDAP run id"
        required: false
        default: ""

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm install
      - name: Smoke start
        run: |
          node -e "const app = require('./server'); setTimeout(() => process.exit(0), 1000);"

  provision:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_github_repo: talhajubayerrbai/tic-tac-toe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Terraform init
        working-directory: deploy
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform apply
        working-directory: deploy
        run: terraform apply -input=false -auto-approve

  verify:
    name: Verify live URL
    runs-on: ubuntu-latest
    needs: provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Terraform init
        working-directory: deploy
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Get public IP
        id: ip
        working-directory: deploy
        run: |
          IP=$(terraform output -raw public_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT
      - name: Wait for app
        run: |
          IP=${{ steps.ip.outputs.ip }}
          URL="http://${IP}:3000"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "$URL/health" > /dev/null 2>&1; then
              echo "Live URL: $URL"
              exit 0
            fi
            echo "Attempt $i: not ready, waiting 10s..."
            sleep 10
          done
          echo "ERROR: app did not respond within 5 minutes"
          exit 1
